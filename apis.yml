name: Vidcaster
description: Vidcaster was a business video experience platform (a 500 Startups / 500 Global portfolio
  company) that helped organizations use video strategically across marketing, sales, training, and
  customer support. Its platform let teams host, manage, enrich, distribute, and analyze videos with a
  customizable player, video galleries, lead-generation gating, video subscriptions, advanced video SEO,
  and integrations with marketing-automation, CRM, and social channels. The company now appears defunct
  because the vidcaster.com web application is no longer reachable (HTTPS/HTTP connections time out) and no public
  API or developer program was ever published. Retained in the API Evangelist network as a historical
  portfolio-lead profile.
